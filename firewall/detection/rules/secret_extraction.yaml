# 3. Secret Extraction - tries to leak the system prompt, keys, configuration or private data.
attack_type: secret_extraction
rules:
  - id: SE-001
    weight: 0.85
    description: reveal the system prompt / hidden instructions
    pattern: '\b(reveal|show|print|output|display|repeat|tell|leak|dump|share|give|expose|disclose|recite|list|write out|spell out|provide|return|paste|include|append|insert|attach|add|quote|send)\b[\w\s,''-]{0,25}?\b(system\s*prompt|system\s+message|initial\s+(prompt|instructions)|hidden\s+(prompt|instructions)|pre-?prompt|developer\s+(message|prompt|instructions)|confidential\s+instructions|your\s+(original\s+|initial\s+|hidden\s+|secret\s+|full\s+|exact\s+)?(instructions|rules|guidelines|configuration|directives|prompt))\b'

  - id: SE-002
    weight: 0.80
    description: repeat everything above
    pattern: '\b(repeat|print|output|copy|echo|write|recite)\b[\w\s]{0,15}?\b(everything|all|the text|the words|all text|the content|word for word)\b[\w\s]{0,15}?\b(above|before|preceding|prior|so far|until now|from the (start|beginning))\b'

  - id: SE-003
    weight: 0.75
    description: asks for keys / tokens / credentials
    pattern: '\b(reveal|show|print|send|output|list|dump|expose|give|share|cat|leak|exfiltrate|return|include|paste|email|post|upload|tell|disclose)\b[\w\s,''-]{0,40}?\b(api[_ -]?keys?|secret[_ -]?keys?|access[_ -]?tokens?|private[_ -]?keys?|environment variables|env vars|\.env\b|connection strings?|aws_secret\w*|ssh keys?|signing keys?|auth tokens?|bearer tokens?|admin passwords?|database passwords?|stored passwords?)\b'

  - id: SE-004
    weight: 0.60
    description: asks how the model was instructed
    pattern: '\b(what|which)\s+(were|are|was)\s+you\s+(told|instructed|programmed|configured|prompted)\b'

  - id: SE-005
    weight: 0.80
    description: start your reply with the system prompt
    pattern: '\b(begin|start)\s+your\s+(reply|response|answer|output)\s+with\b[\w\s"'':]{0,30}?\b(system|initial|instructions|prompt)\b'

  - id: SE-006
    weight: 0.60
    description: verbatim instructions
    pattern: '\b(verbatim|word for word|exactly as written|character for character)\b[\w\s]{0,30}?\b(instructions|prompt|rules|system message)\b|\b(instructions|prompt|system message)\b[\w\s]{0,30}?\b(verbatim|word for word)\b'

  - id: SE-007
    weight: 0.70
    description: reads sensitive files
    pattern: '\b(contents? of|read|cat|open|print|type|display)\s+[\w\s]{0,10}?(/etc/passwd|/etc/shadow|~/\.ssh|id_rsa|\.aws/credentials|\.env\b|secrets?\.(ya?ml|json)|\.git-credentials|\.npmrc|\.netrc)'

  - id: SE-008
    weight: 0.70
    description: what is your key / password
    pattern: '\b(what is|what''s|what are|tell me|give me)\s+(your|the)\s+(api[_ -]?key|password|secret|access token|admin password|secret key|private key)\b|\b(what is|what''s|what are|what were)\s+your\s+(system\s*prompt|initial\s+(prompt|instructions)|hidden\s+(prompt|instructions)|secret\s+instructions|original\s+instructions)\b'
